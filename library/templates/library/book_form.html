{% extends "library/base.html" %}
{% block title %}{{ heading }}{% endblock %}
{% block content %}

<form method="post" class="card" novalidate>

  {{ form.as_p }}

  <a href="{% url 'book_list' %}">Cancel</a>
</form>
{% endblock %}
